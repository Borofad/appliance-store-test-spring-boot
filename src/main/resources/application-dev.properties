# ---------- In-memory H2 (development and tests) ----------
spring.datasource.url=jdbc:h2:mem:store;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

# Hibernate creates the tables from the model, then the SQL files load the data
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:manufacturer.sql, classpath:client.sql, classpath:employee.sql, classpath:appliance.sql

logging.level.org.hibernate.SQL=DEBUG

# JWT signing secret: DEVELOPMENT ONLY (at least 32 characters). Never reuse it in production.
app.jwt.secret=dev-only-secret-change-me-0123456789abcdef