<!DOCTYPE html>
<!--
  Generic error page.
  - Used directly by GlobalExceptionHandler (model attributes: status, title, message).
  - Reused by 403.html / 404.html / 500.html through the "page" fragment below.
-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(status, title, message)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Error</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{menunavy :: line}"></div>
<div class="container text-center mt-5">
    <h1 class="display-1 text-primary" th:text="${status}">500</h1>
    <h2 th:text="${title}">Something went wrong</h2>
    <p class="lead" th:text="${message}">An unexpected error occurred.</p>
    <a class="btn btn-primary" th:href="@{/}" th:text="#{error.link.backHome}">Back to home page</a>
</div>
</body>
</html>
