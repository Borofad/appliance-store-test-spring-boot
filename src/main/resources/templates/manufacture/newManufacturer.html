<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${editing} ? #{manufacturer.edit.title} : #{manufacturer.add.title})}"></head>
<body>
<div th:replace="~{menunavy :: navy}"></div>
<div class="container mt-4" style="max-width: 600px;">
    <h1 class="h3 mb-3"
        th:text="${editing} ? #{manufacturer.edit.title} : #{manufacturer.add.title}">Add manufacturer</h1>

    <!-- one form for both "add" and "edit"; errors are shown next to the field and the field is highlighted -->
    <form method="post" th:object="${manufacturer}" novalidate
          th:action="${editing} ? @{/manufacturers/{id}(id=${manufacturer.id})} : @{/manufacturers}">
        <div class="mb-3">
            <label for="name" class="form-label" th:text="#{manufacturer.name}">Name</label>
            <input type="text" id="name" class="form-control" maxlength="100"
                   th:field="*{name}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{name}">Name error</div>
        </div>
        <button type="submit" class="btn btn-primary" th:text="#{button.save}">Save</button>
        <a class="btn btn-outline-secondary" th:href="@{/manufacturers}" th:text="#{button.cancel}">Cancel</a>
    </form>
</div>
</body>
</html>
