<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{login.title}">Log in</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{menunavy :: line}"></div>
<div class="container mt-5" style="max-width: 420px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="card-title mb-3" th:text="#{login.title}">Log in</h2>

            <div class="alert alert-danger" th:if="${param.error}" th:text="#{login.error}">
                Invalid email or password
            </div>
            <div class="alert alert-success" th:if="${param.logout}" th:text="#{login.logout.success}">
                You have been logged out successfully
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label" th:text="#{login.email}">Email</label>
                    <input type="email" class="form-control" id="email" name="email"
                           autocomplete="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label" th:text="#{login.password}">Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" th:text="#{login.submit}">Log in</button>
            </form>
        </div>
    </div>
    <p class="text-center mt-3">
        <a th:href="@{/login(lang='en')}">English</a> |
        <a th:href="@{/login(lang='uk')}">Українська</a>
    </p>
</div>
</body>
</html>
