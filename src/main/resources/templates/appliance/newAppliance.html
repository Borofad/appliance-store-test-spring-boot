<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${editing} ? #{appliance.edit.title} : #{appliance.add.title})}"></head>
<body>
<div th:replace="~{menunavy :: navy}"></div>
<div class="container mt-4" style="max-width: 800px;">
    <h1 class="h3 mb-3" th:text="${editing} ? #{appliance.edit.title} : #{appliance.add.title}">Add appliance</h1>

    <!-- one form for both "add" and "edit"; every error is shown next to its field and the field is highlighted -->
    <form method="post" th:object="${appliance}" novalidate
          th:action="${editing} ? @{/appliances/{id}(id=${appliance.id})} : @{/appliances}">
        <div class="row g-3">

            <div class="col-md-6">
                <label for="name" class="form-label" th:text="#{appliance.name}">Name</label>
                <input type="text" id="name" class="form-control" maxlength="100"
                       th:field="*{name}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{name}">Name error</div>
            </div>

            <div class="col-md-6">
                <label for="model" class="form-label" th:text="#{appliance.model}">Model</label>
                <input type="text" id="model" class="form-control" maxlength="100"
                       th:field="*{model}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{model}">Model error</div>
            </div>

            <div class="col-md-6">
                <label for="manufacturerId" class="form-label" th:text="#{appliance.manufacturer}">Manufacturer</label>
                <select id="manufacturerId" class="form-select" th:field="*{manufacturerId}" th:errorclass="is-invalid">
                    <option value="" th:text="#{label.choose}">-- Choose --</option>
                    <option th:each="m : ${manufacturers}" th:value="${m.id}" th:text="${m.name}">Samsung</option>
                </select>
                <div class="invalid-feedback" th:errors="*{manufacturerId}">Manufacturer error</div>
            </div>

            <div class="col-md-3">
                <label for="category" class="form-label" th:text="#{appliance.category}">Category</label>
                <select id="category" class="form-select" th:field="*{category}" th:errorclass="is-invalid">
                    <option value="" th:text="#{label.choose}">-- Choose --</option>
                    <option th:each="c : ${categories}" th:value="${c}" th:text="#{|category.${c}|}">Big</option>
                </select>
                <div class="invalid-feedback" th:errors="*{category}">Category error</div>
            </div>

            <div class="col-md-3">
                <label for="powerType" class="form-label" th:text="#{appliance.powerType}">Power type</label>
                <select id="powerType" class="form-select" th:field="*{powerType}" th:errorclass="is-invalid">
                    <option value="" th:text="#{label.choose}">-- Choose --</option>
                    <option th:each="p : ${powerTypes}" th:value="${p}" th:text="#{|powerType.${p}|}">AC 220 V</option>
                </select>
                <div class="invalid-feedback" th:errors="*{powerType}">Power type error</div>
            </div>

            <div class="col-md-6">
                <label for="power" class="form-label" th:text="#{appliance.power}">Power (W)</label>
                <input type="number" id="power" class="form-control" min="1" step="1"
                       th:field="*{power}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{power}">Power error</div>
            </div>

            <div class="col-md-6">
                <label for="price" class="form-label" th:text="#{appliance.price}">Price</label>
                <input type="number" id="price" class="form-control" min="0.01" step="0.01"
                       th:field="*{price}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{price}">Price error</div>
            </div>

            <div class="col-12">
                <label for="characteristic" class="form-label" th:text="#{appliance.characteristic}">Characteristic</label>
                <input type="text" id="characteristic" class="form-control" maxlength="255"
                       th:field="*{characteristic}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{characteristic}">Characteristic error</div>
            </div>

            <div class="col-12">
                <label for="description" class="form-label" th:text="#{appliance.description}">Description</label>
                <textarea id="description" class="form-control" rows="3" maxlength="1000"
                          th:field="*{description}" th:errorclass="is-invalid"></textarea>
                <div class="invalid-feedback" th:errors="*{description}">Description error</div>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary" th:text="#{button.save}">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/appliances}" th:text="#{button.cancel}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
