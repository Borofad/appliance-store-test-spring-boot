<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{appliance.title})}"></head>
<body>
<div th:replace="~{menunavy :: navy}"></div>
<div class="container mt-4">

    <div class="alert alert-success" th:if="${param.created}" th:text="#{message.created}"></div>
    <div class="alert alert-success" th:if="${param.updated}" th:text="#{message.updated}"></div>
    <div class="alert alert-success" th:if="${param.deleted}" th:text="#{message.deleted}"></div>
    <div class="alert alert-danger" th:if="${param.deleteFailed}" th:text="#{error.appliance.inUse}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="#{appliance.title}">Appliances</h1>
        <a class="btn btn-primary" th:href="@{/appliances/new}" th:text="#{button.add}">Add</a>
    </div>

    <!-- search and page size -->
    <form class="row g-2 mb-3" method="get" th:action="@{/appliances}">
        <div class="col-sm-6 col-md-5">
            <input type="text" name="query" class="form-control" maxlength="100"
                   th:value="${query}" th:placeholder="#{label.search.placeholder}">
        </div>
        <div class="col-auto">
            <select name="size" class="form-select" th:title="#{label.pageSize}">
                <option th:each="s : ${pageSizes}" th:value="${s}" th:text="${s}" th:selected="${s == size}">10</option>
            </select>
        </div>
        <input type="hidden" name="sortField" th:value="${sortField}">
        <input type="hidden" name="sortDir" th:value="${sortDir}">
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary" th:text="#{button.search}">Search</button>
            <a class="btn btn-outline-secondary" th:href="@{/appliances}" th:text="#{button.reset}">Reset</a>
        </div>
    </form>

    <p th:if="${page.empty}" class="text-muted" th:text="#{label.noData}">No data to display</p>

    <div class="table-responsive" th:unless="${page.empty}">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th:block th:replace="~{fragments/table :: sortHeader('/appliances', 'id', #{label.id})}"></th:block>
                <th:block th:replace="~{fragments/table :: sortHeader('/appliances', 'name', #{appliance.name})}"></th:block>
                <th:block th:replace="~{fragments/table :: sortHeader('/appliances', 'category', #{appliance.category})}"></th:block>
                <th:block th:replace="~{fragments/table :: sortHeader('/appliances', 'model', #{appliance.model})}"></th:block>
                <th:block th:replace="~{fragments/table :: sortHeader('/appliances', 'manufacturer.name', #{appliance.manufacturer})}"></th:block>
                <th th:text="#{appliance.powerType}">Power type</th>
                <th:block th:replace="~{fragments/table :: sortHeader('/appliances', 'power', #{appliance.power})}"></th:block>
                <th:block th:replace="~{fragments/table :: sortHeader('/appliances', 'price', #{appliance.price})}"></th:block>
                <th th:text="#{label.actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${page.content}">
                <td th:text="${a.id}">1</td>
                <td th:text="${a.name}">Claw</td>
                <td th:text="#{|category.${a.category}|}">Big</td>
                <td th:text="${a.model}">M-1</td>
                <td th:text="${a.manufacturerName}">Samsung</td>
                <td th:text="#{|powerType.${a.powerType}|}">AC 220 V</td>
                <td th:text="${a.power}">600</td>
                <td th:text="${#numbers.formatDecimal(a.price, 1, 2)}">1.01</td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/appliances/{id}/edit(id=${a.id})}"
                       th:text="#{button.edit}">Edit</a>
                    <form class="d-inline" method="post" th:action="@{/appliances/{id}/delete(id=${a.id})}"
                          th:onsubmit="|return confirm('#{label.confirmDelete}');|">
                        <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{button.delete}">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-between align-items-center">
        <span class="text-muted" th:text="#{label.total(${page.totalElements})}">Total: 7</span>
        <div th:replace="~{fragments/table :: pagination(${page}, '/appliances')}"></div>
    </div>
</div>
</body>
</html>
