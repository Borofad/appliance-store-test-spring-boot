<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${editing} ? #{client.edit.title} : #{client.add.title})}"></head>
<body>
<div th:replace="~{menunavy :: navy}"></div>
<div class="container mt-4" style="max-width: 700px;">
    <h1 class="h3 mb-3" th:text="${editing} ? #{client.edit.title} : #{client.add.title}">Add client</h1>

    <!-- one form for both "add" and "edit"; every error is shown next to its field and the field is highlighted -->
    <form method="post" th:object="${client}" novalidate autocomplete="off"
          th:action="${editing} ? @{/clients/{id}(id=${client.id})} : @{/clients}">
        <div class="row g-3">

            <div class="col-md-6">
                <label for="name" class="form-label" th:text="#{user.name}">Name</label>
                <input type="text" id="name" class="form-control" maxlength="100"
                       th:field="*{name}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{name}">Name error</div>
            </div>

            <div class="col-md-6">
                <label for="card" class="form-label" th:text="#{client.card}">Card number</label>
                <input type="text" id="card" class="form-control" maxlength="50"
                       th:field="*{card}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{card}">Card error</div>
            </div>

            <div class="col-12">
                <label for="email" class="form-label" th:text="#{user.email}">Email</label>
                <input type="email" id="email" class="form-control" autocomplete="off"
                       th:field="*{email}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{email}">Email error</div>
            </div>

            <div class="col-md-6">
                <label for="password" class="form-label" th:text="#{user.password}">Password</label>
                <input type="password" id="password" class="form-control" autocomplete="new-password"
                       th:field="*{password}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{password}">Password error</div>
            </div>

            <div class="col-md-6">
                <label for="confirmPassword" class="form-label" th:text="#{register.confirmPassword}">Confirm password</label>
                <input type="password" id="confirmPassword" class="form-control" autocomplete="new-password"
                       th:field="*{confirmPassword}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{confirmPassword}">Confirmation error</div>
            </div>

            <div class="col-12">
                <div class="form-text" th:text="#{user.password.hint}">Password rules</div>
                <div class="form-text" th:if="${editing}" th:text="#{user.password.keep}">Leave empty to keep the current password</div>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary" th:text="#{button.save}">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/clients}" th:text="#{button.cancel}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
