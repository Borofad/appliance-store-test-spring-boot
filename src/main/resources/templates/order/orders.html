<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{orders.title})}"></head>
<body>
<div th:replace="~{menunavy :: navy}"></div>
<div class="container mt-4">

    <div class="alert alert-success" th:if="${param.deleted}" th:text="#{message.deleted}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="#{orders.title}">Orders</h1>
        <a class="btn btn-primary" th:href="@{/orders/new}" th:text="#{button.add}">Add</a>
    </div>

    <!-- page size -->
    <form class="row g-2 mb-3" method="get" th:action="@{/orders}">
        <div class="col-auto">
            <select name="size" class="form-select" th:title="#{label.pageSize}">
                <option th:each="s : ${pageSizes}" th:value="${s}" th:text="${s}" th:selected="${s == size}">10</option>
            </select>
        </div>
        <input type="hidden" name="sortField" th:value="${sortField}">
        <input type="hidden" name="sortDir" th:value="${sortDir}">
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary" th:text="#{button.search}">Search</button>
            <a class="btn btn-outline-secondary" th:href="@{/orders}" th:text="#{button.reset}">Reset</a>
        </div>
    </form>

    <p th:if="${page.empty}" class="text-muted" th:text="#{label.noData}">No data to display</p>

    <div class="table-responsive" th:unless="${page.empty}">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th:block th:replace="~{fragments/table :: sortHeader('/orders', 'id', #{label.id})}"></th:block>
                <th:block th:if="${employeeView}">
                    <th:block th:replace="~{fragments/table :: sortHeader('/orders', 'client.name', #{orders.client})}"></th:block>
                </th:block>
                <th:block th:replace="~{fragments/table :: sortHeader('/orders', 'approved', #{orders.status})}"></th:block>
                <th th:text="#{orders.employee}">Employee</th>
                <th th:text="#{orders.items}">Items</th>
                <th th:text="#{orders.total}">Total</th>
                <th th:text="#{label.actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${page.content}">
                <td th:text="${o.id}">1</td>
                <td th:if="${employeeView}" th:text="${o.clientName}">Mercury</td>
                <td>
                    <span class="badge bg-success" th:if="${o.approved}" th:text="#{orders.status.approved}">Approved</span>
                    <span class="badge bg-warning text-dark" th:unless="${o.approved}" th:text="#{orders.status.pending}">Pending</span>
                </td>
                <td th:text="${o.employeeName != null} ? ${o.employeeName} : '-'">-</td>
                <td th:text="${#lists.size(o.rows)}">1</td>
                <td th:text="${#numbers.formatDecimal(o.total, 1, 2)}">0.00</td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/orders/{id}(id=${o.id})}"
                       th:text="#{button.view}">View</a>
                    <th:block th:unless="${o.approved}">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/orders/{id}/edit(id=${o.id})}"
                           th:text="#{button.edit}">Edit</a>
                        <form class="d-inline" method="post" th:action="@{/orders/{id}/delete(id=${o.id})}"
                              th:onsubmit="|return confirm('#{label.confirmDelete}');|">
                            <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{button.delete}">Delete</button>
                        </form>
                        <form class="d-inline" method="post" th:if="${employeeView}"
                              th:action="@{/orders/{id}/approve(id=${o.id})}">
                            <button type="submit" class="btn btn-sm btn-success" th:text="#{button.approve}">Approve</button>
                        </form>
                    </th:block>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-between align-items-center">
        <span class="text-muted" th:text="#{label.total(${page.totalElements})}">Total: 3</span>
        <div th:replace="~{fragments/table :: pagination(${page}, '/orders')}"></div>
    </div>
</div>
</body>
</html>
