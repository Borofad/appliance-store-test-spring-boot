<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{orders.view.title})}"></head>
<body>
<div th:replace="~{menunavy :: navy}"></div>
<div class="container mt-4" style="max-width: 900px;">

  <div class="alert alert-success" th:if="${param.created}" th:text="#{message.created}"></div>
  <div class="alert alert-success" th:if="${param.updated}" th:text="#{message.updated}"></div>
  <div class="alert alert-success" th:if="${param.approved}" th:text="#{message.order.approved}"></div>
  <div class="alert alert-danger" th:if="${param.alreadyApproved}" th:text="#{error.order.alreadyApproved}"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">[[#{orders.view.title}]] [[${order.id}]]</h1>
    <span class="badge bg-success fs-6" th:if="${order.approved}" th:text="#{orders.status.approved}">Approved</span>
    <span class="badge bg-warning text-dark fs-6" th:unless="${order.approved}" th:text="#{orders.status.pending}">Pending</span>
  </div>

  <dl class="row">
    <dt class="col-sm-3" th:text="#{orders.client}">Client</dt>
    <dd class="col-sm-9" th:text="${order.clientName}">Mercury</dd>
    <dt class="col-sm-3" th:text="#{orders.employee}">Employee</dt>
    <dd class="col-sm-9" th:text="${order.employeeName != null} ? ${order.employeeName} : '-'">-</dd>
  </dl>

  <h2 class="h5" th:text="#{orders.rows}">Order items</h2>
  <table class="table table-striped align-middle">
    <thead>
    <tr>
      <th th:text="#{orderRow.appliance}">Appliance</th>
      <th th:text="#{orderRow.number}">Quantity</th>
      <th th:text="#{orderRow.amount}">Amount</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="row : ${order.rows}">
      <td th:text="${row.applianceName}">Claw</td>
      <td th:text="${row.number}">1</td>
      <td th:text="${#numbers.formatDecimal(row.amount, 1, 2)}">1.01</td>
    </tr>
    </tbody>
    <tfoot>
    <tr class="fw-bold">
      <td colspan="2" th:text="#{orders.total}">Total</td>
      <td th:text="${#numbers.formatDecimal(order.total, 1, 2)}">1.01</td>
    </tr>
    </tfoot>
  </table>

  <div class="mt-3">
    <a class="btn btn-outline-secondary" th:href="@{/orders}" th:text="#{button.back}">Back</a>
    <th:block th:unless="${order.approved}">
      <a class="btn btn-outline-primary" th:href="@{/orders/{id}/edit(id=${order.id})}" th:text="#{button.edit}">Edit</a>
      <form class="d-inline" method="post" th:action="@{/orders/{id}/delete(id=${order.id})}"
            th:onsubmit="|return confirm('#{label.confirmDelete}');|">
        <button type="submit" class="btn btn-outline-danger" th:text="#{button.delete}">Delete</button>
      </form>
      <form class="d-inline" method="post" th:if="${employeeView}"
            th:action="@{/orders/{id}/approve(id=${order.id})}">
        <button type="submit" class="btn btn-success" th:text="#{button.approve}">Approve</button>
      </form>
    </th:block>
  </div>
</div>
</body>
</html>
