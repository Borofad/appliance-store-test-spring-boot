<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(#{app.title})}"></head>
<body>
<div th:replace="~{menunavy :: navy}"></div>
<div class="container mt-4">
    <h1 th:text="#{index.title}">Welcome to the Appliance Store</h1>
    <p class="lead" th:text="#{index.subtitle}">Find the best home appliances at the best price</p>
    <p th:text="#{label.welcome(${userName})}">Welcome!</p>

    <!-- shortcuts: each role sees only what it may use -->
    <div class="d-flex flex-wrap gap-2 mt-3">
        <a class="btn btn-primary" th:href="@{/appliances}" th:text="#{nav.appliances}">Appliances</a>
        <a class="btn btn-outline-primary" th:href="@{/orders}" sec:authorize="hasRole('CLIENT')"
           th:text="#{nav.myOrders}">My orders</a>
        <a class="btn btn-outline-primary" th:href="@{/orders}" sec:authorize="hasRole('EMPLOYEE')"
           th:text="#{nav.orders}">Orders</a>
        <a class="btn btn-outline-secondary" th:href="@{/manufacturers}" sec:authorize="hasRole('EMPLOYEE')"
           th:text="#{nav.manufacturers}">Manufacturers</a>
        <a class="btn btn-outline-secondary" th:href="@{/clients}" sec:authorize="hasRole('EMPLOYEE')"
           th:text="#{nav.clients}">Clients</a>
        <a class="btn btn-outline-secondary" th:href="@{/employees}" sec:authorize="hasRole('EMPLOYEE')"
           th:text="#{nav.employees}">Employees</a>
    </div>
</div>
</body>
</html>
