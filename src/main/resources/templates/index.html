<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{app.title}">Appliance Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{menunavy :: navy}"></div>
<div class="container mt-4">
    <h1 th:text="#{index.title}">Welcome to the Appliance Store</h1>
    <p class="lead" th:text="#{index.subtitle}">Find the best home appliances at the best price</p>
    <p th:text="#{label.welcome(${userName})}">Welcome!</p>

    <!-- temporary: step S6 moves login/logout into the navbar -->
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-outline-secondary" th:text="#{nav.logout}">Log out</button>
    </form>
</div>
</body>
</html>
