<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{employee.title})}"></head>
<body>
<div th:replace="~{menunavy :: navy}"></div>
<div class="container mt-4">

    <div class="alert alert-success" th:if="${param.created}" th:text="#{message.created}"></div>
    <div class="alert alert-success" th:if="${param.updated}" th:text="#{message.updated}"></div>
    <div class="alert alert-success" th:if="${param.deleted}" th:text="#{message.deleted}"></div>
    <div class="alert alert-danger" th:if="${param.deleteFailed}" th:text="#{error.employee.inUse}"></div>
    <div class="alert alert-danger" th:if="${param.deleteSelf}" th:text="#{error.employee.deleteSelf}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="#{employee.title}">Employees</h1>
        <a class="btn btn-primary" th:href="@{/employees/new}" th:text="#{button.add}">Add</a>
    </div>

    <!-- search and page size -->
    <form class="row g-2 mb-3" method="get" th:action="@{/employees}">
        <div class="col-sm-6 col-md-5">
            <input type="text" name="query" class="form-control" maxlength="100"
                   th:value="${query}" th:placeholder="#{label.search.placeholder}">
        </div>
        <div class="col-auto">
            <select name="size" class="form-select" th:title="#{label.pageSize}">
                <option th:each="s : ${pageSizes}" th:value="${s}" th:text="${s}" th:selected="${s == size}">10</option>
            </select>
        </div>
        <input type="hidden" name="sortField" th:value="${sortField}">
        <input type="hidden" name="sortDir" th:value="${sortDir}">
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary" th:text="#{button.search}">Search</button>
            <a class="btn btn-outline-secondary" th:href="@{/employees}" th:text="#{button.reset}">Reset</a>
        </div>
    </form>

    <p th:if="${page.empty}" class="text-muted" th:text="#{label.noData}">No data to display</p>

    <div class="table-responsive" th:unless="${page.empty}">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th:block th:replace="~{fragments/table :: sortHeader('/employees', 'id', #{label.id})}"></th:block>
                <th:block th:replace="~{fragments/table :: sortHeader('/employees', 'name', #{user.name})}"></th:block>
                <th:block th:replace="~{fragments/table :: sortHeader('/employees', 'email', #{user.email})}"></th:block>
                <th:block th:replace="~{fragments/table :: sortHeader('/employees', 'department', #{employee.department})}"></th:block>
                <th th:text="#{label.actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${page.content}">
                <td th:text="${e.id}">1</td>
                <td th:text="${e.name}">Phobos</td>
                <td th:text="${e.email}">phobos@gmail.com</td>
                <td th:text="${e.department}">salle</td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/employees/{id}/edit(id=${e.id})}"
                       th:text="#{button.edit}">Edit</a>
                    <!-- no Delete button on the logged-in employee's own row -->
                    <form class="d-inline" method="post" th:unless="${e.id == currentEmployeeId}"
                          th:action="@{/employees/{id}/delete(id=${e.id})}"
                          th:onsubmit="|return confirm('#{label.confirmDelete}');|">
                        <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{button.delete}">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-between align-items-center">
        <span class="text-muted" th:text="#{label.total(${page.totalElements})}">Total: 4</span>
        <div th:replace="~{fragments/table :: pagination(${page}, '/employees')}"></div>
    </div>
</div>
</body>
</html>
