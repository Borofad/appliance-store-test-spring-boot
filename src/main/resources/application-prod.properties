# ---------- MySQL (production, data is kept between restarts) ----------
# Credentials come from environment variables (defaults are for local use only)
spring.datasource.url=jdbc:mysql://localhost:3306/appliance_store?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=false

# update: keep existing data, add missing tables/columns
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Initial data is loaded only on request, otherwise it would be inserted again at every start.
# First run only:  --spring.sql.init.mode=always
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:manufacturer.sql, classpath:client.sql, classpath:employee.sql, classpath:appliance.sql

logging.level.root=WARN
logging.level.com.epam.rd.autocode.assessment.appliances=INFO

# JWT signing secret from an environment variable (no default on purpose: the app refuses to start without it).
# Use at least 32 random characters, e.g.:  export JWT_SECRET=$(openssl rand -base64 48)
app.jwt.secret=${JWT_SECRET}

# The login cookie is only sent over HTTPS. Set JWT_COOKIE_SECURE=false only for a plain-http test run.
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
