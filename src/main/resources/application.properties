spring.application.name=appliance-store
server.port=8080

# Active profile: dev = in-memory H2 (development and tests), prod = MySQL.
spring.profiles.active=dev

# Messages (i18n bundles)
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Thymeleaf
spring.thymeleaf.cache=false

# Never expose stack traces or detailed error messages to users
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Sessions
server.servlet.session.timeout=30m

# Logging
logging.level.root=INFO
logging.level.com.epam.rd.autocode.assessment.appliances=DEBUG